name: Inference evidence mapping contract
on:
  pull_request:
    paths:
      - "scripts/prepare_inference_event.py"
      - "scripts/test_prepare_inference_event.py"
      - "scripts/prepare_monitor_conduction_event.py"
      - "scripts/test_prepare_monitor_conduction_event.py"
      - "fixtures/inference/era-avot-circulation-001.completed.json"
      - "docs/ERA_AVOT_CIRCULATION_001.md"
      - ".github/workflows/ingest.yml"
      - ".github/workflows/inference-evidence-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test real-local evidence mapping
        run: python3 -m unittest discover -s scripts -p 'test_prepare_inference_event.py' -v
      - name: Test ERA circulation exact-byte custody
        run: python3 -m unittest discover -s scripts -p 'test_prepare_monitor_conduction_event.py' -v
